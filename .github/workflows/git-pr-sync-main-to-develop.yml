---
name: Git PR Sync main to develop

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  git-pr-sync-main-to-develop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # git-pr-release needs the git histories
          persist-credentials: false
      - name: Check for changes
        id: check_for_changes
        continue-on-error: true
        run: |
          set +e

          if ! git diff --quiet --exit-code origin/main origin/develop
          then
            echo "No changes between main and develop"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes between main and develop"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

          set -e
      - name: Setup Ruby
        if: steps.check_for_changes.outputs.has_changes == 'true'
        uses: ruby/setup-ruby@829114fc20da43a41d27359103ec7a63020954d4 # v1.255.0
      - name: Install git-pr-release
        if: steps.check_for_changes.outputs.has_changes == 'true'
        run: gem install --no-document git-pr-release
      - name: Run git-pr-release
        if: steps.check_for_changes.outputs.has_changes == 'true'
        run: git-pr-release
        env:
          GIT_PR_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_PR_RELEASE_BRANCH_PRODUCTION: develop
          GIT_PR_RELEASE_BRANCH_STAGING: main
          GIT_PR_RELEASE_LABELS: pr-release
          GIT_PR_RELEASE_TEMPLATE: .github/workflows/git-pr-sync-main-to-develop.erb
          TZ: Asia/Tokyo
