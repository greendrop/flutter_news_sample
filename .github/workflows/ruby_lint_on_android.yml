---
name: Ruby Lint on Android

on:
  pull_request:
    paths:
      - android/**/*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@d781c1b4ed31764801bfae177617bb0446f5ef8d # v1.218.0

      - name: Cache Ruby bundle
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: android/vendor/bundle
          key: android-ruby-bundle-${{ hashFiles('.ruby-version') }}-${{ hashFiles('**/android/Gemfile.lock') }}

      - name: Run bundle install
        working-directory: ./android
        run: |
          bundle config path vendor/bundle
          bundle install --clean

      - name: Run rubocop
        working-directory: ./android
        run: |
          bundle exec rubocop --parallel
