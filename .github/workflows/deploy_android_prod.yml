---
name: Deploy Android (Prod)

env:
  JAVA_DISTRIBUTION: microsoft
  JAVA_VERSION: 17

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 'Pull Request Number'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Get Flutter version from .fvmrc
        id: get_flutter_version
        run: |
          flutter_version="$(< .fvmrc jq -r .flutter)"
          echo "version=$flutter_version" >> "$GITHUB_OUTPUT"

      - name: Setup flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: "stable"
          flutter-version: ${{ steps.get_flutter_version.outputs.version }}
          cache: true

      - name: Run flutter pub get
        run: |
          flutter pub get

      - name: Setup Ruby
        uses: ruby/setup-ruby@6797dcbb9a1889fd411d07e8aba7eded53fb8b48 # v1.264.0

      - name: Cache Ruby bundle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: packages/app/android/vendor/bundle
          key: packages-app-android-ruby-bundle-${{ runner.os }}-${{ hashFiles('.ruby-version') }}-${{ hashFiles('**/android/Gemfile.lock') }}

      - name: Run bundle install
        working-directory: packages/app/android
        run: |
          bundle config path vendor/bundle
          bundle install --clean

      - name: Create dart define file
        working-directory: packages/app
        env:
          DART_DEFINE_FILE_PATH: dart_define/prod.json
          DART_DEFINE_FILE_PROD_JSON: ${{ secrets.DART_DEFINE_FILE_PROD_JSON }}
        run: |
          echo "$DART_DEFINE_FILE_PROD_JSON" | base64 --decode > "$DART_DEFINE_FILE_PATH"

      - name: Create google-services.json
        working-directory: packages/app
        env:
          FIREBASE_PROD_GOOGLE_SERVICE_JSON: ${{ secrets.FIREBASE_PROD_GOOGLE_SERVICE_JSON }}
        run: |
          mkdir -p android/app/src/prod
          echo "$FIREBASE_PROD_GOOGLE_SERVICE_JSON" | base64 --decode > android/app/src/prod/google-services.json

      - name: Create upload-keystore.jks
        working-directory: packages/app
        env:
          ANDROID_KEYSTORE_JKS: ${{ secrets.ANDROID_KEYSTORE_JKS }}
        run: |
          echo "$ANDROID_KEYSTORE_JKS" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        working-directory: packages/app
        env:
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          echo "$ANDROID_KEY_PROPERTIES" | base64 --decode > android/app/key.properties

      - name: Run flutter build
        working-directory: packages/app/android
        run: |
          bundle exec fastlane android build_prod

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-prod-release
          path: packages/app/build/app/outputs/bundle/release/app-release.aab

  deploy:
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: app-prod-release
          path: packages/app/build/app/outputs/bundle/release/

      - name: Setup Ruby
        uses: ruby/setup-ruby@6797dcbb9a1889fd411d07e8aba7eded53fb8b48 # v1.264.0

      - name: Cache Ruby bundle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: packages/app/android/vendor/bundle
          key: packages-app-android-ruby-bundle-${{ runner.os }}-${{ hashFiles('.ruby-version') }}-${{ hashFiles('**/android/Gemfile.lock') }}

      - name: Run bundle install
        working-directory: packages/app/android
        run: |
          bundle config path vendor/bundle
          bundle install --clean

      - name: Create google-play-store-credentials.json
        working-directory: packages/app
        env:
          DEPLOY_ANDROID_PROD_GOOGLE_PLAY_STORE_CREDENTIALS_JSON: ${{ secrets.DEPLOY_ANDROID_PROD_GOOGLE_PLAY_STORE_CREDENTIALS_JSON }}
        run: |
          echo "$DEPLOY_ANDROID_PROD_GOOGLE_PLAY_STORE_CREDENTIALS_JSON" | base64 --decode > android/google-play-store-credentials.json

      - name: Run fastlane android deploy_prod
        working-directory: packages/app/android
        env:
          DEPLOY_ANDROID_PROD_PACKAGE_NAME: ${{ vars.DEPLOY_ANDROID_PROD_PACKAGE_NAME }}
        run: |
          bundle exec fastlane android deploy_prod

      - name: Post deploied comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        if: ${{ github.event.inputs.pull_request_number != '' }}
        env:
          MESSAGE: |
            Deploied Android (Prod) to Google Play Store
        with:
          script: |
            if (Number.isInteger(Number.parseInt("${{ inputs.pull_request_number }}"))) {
              github.rest.issues.createComment({
                issue_number: Number.parseInt("${{ inputs.pull_request_number }}"),
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: process.env.MESSAGE
              })
            }
