---
name: Ruby Lint on App Android

on:
  pull_request:
    paths:
      - packages/app/android/**/*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@2a7b30092b0caf9c046252510f9273b4875f3db9 # v1.254.0

      - name: Cache Ruby bundle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: packages/app/android/vendor/bundle
          key: packages-app-android-ruby-bundle-${{ hashFiles('.ruby-version') }}-${{ hashFiles('**/android/Gemfile.lock') }}

      - name: Run bundle install
        working-directory: packages/app/android
        run: |
          bundle config path vendor/bundle
          bundle install --clean

      - name: Run rubocop
        working-directory: packages/app/android
        run: |
          bundle exec rubocop --parallel
