---
name: Deploy Android (Stg)

env:
  JAVA_DISTRIBUTION: microsoft
  JAVA_VERSION: 17
  DART_DEFINE_FILE_PATH: dart_define/stg.json

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 'Pull Request Number'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Get Flutter version from .fvmrc
        id: get_flutter_version
        run: |
          flutter_version="$(< .fvmrc jq -r .flutter)"
          echo "version=$flutter_version" >> "$GITHUB_OUTPUT"

      - name: Setup flutter
        uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1 # v2.16.0
        with:
          channel: "stable"
          flutter-version: ${{ steps.get_flutter_version.outputs.version }}
          cache: true

      - name: Run flutter pub get
        run: |
          flutter pub get

      - name: Create dart define file
        env:
          DART_DEFINE_FILE_STG_JSON: ${{ secrets.DART_DEFINE_FILE_STG_JSON }}
        run: |
          echo "$DART_DEFINE_FILE_STG_JSON" | base64 --decode > "$DART_DEFINE_FILE_PATH"

      - name: Create google-services.json
        env:
          FIREBASE_STG_GOOGLE_SERVICE_JSON: ${{ secrets.FIREBASE_STG_GOOGLE_SERVICE_JSON }}
        run: |
          mkdir -p android/app/src/stg
          echo "$FIREBASE_STG_GOOGLE_SERVICE_JSON" | base64 --decode > android/app/src/stg/google-services.json

      - name: Create upload-keystore.jks
        env:
          ANDROID_KEYSTORE_JKS: ${{ secrets.ANDROID_KEYSTORE_JKS }}
        run: |
          echo "$ANDROID_KEYSTORE_JKS" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          echo "$ANDROID_KEY_PROPERTIES" | base64 --decode > android/app/key.properties

      - name: Run flutter build
        run: |
          flutter build apk --release --dart-define-from-file="$DART_DEFINE_FILE_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: app-stg-release
          path: build/app/outputs/flutter-apk/app-release.apk

  deploy:
    name: Deploy
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: app-stg-release
          path: build/app/outputs/flutter-apk

      - name: Setup Ruby
        uses: ruby/setup-ruby@a2bbe5b1b236842c1cb7dd11e8e3b51e0a616acc # v1.202.0

      - name: Cache Ruby bundle
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: android/vendor/bundle
          key: android-ruby-bundle-${{ hashFiles('.ruby-version') }}-${{ hashFiles('**/android/Gemfile.lock') }}

      - name: Run bundle install
        working-directory: ./android
        run: |
          bundle config path vendor/bundle
          bundle install --clean

      - name: Run fastlane android deploy_stg
        env:
          DEPLOY_ANDROID_STG_FIREBASE_CLI_TOKEN: ${{ secrets.DEPLOY_ANDROID_STG_FIREBASE_CLI_TOKEN }}
          DEPLOY_ANDROID_STG_APP: ${{ vars.DEPLOY_ANDROID_STG_APP }}
          DEPLOY_ANDROID_STG_TESTER_GROUPS: ${{ vars.DEPLOY_ANDROID_STG_TESTER_GROUPS }}
          DEPLOY_ANDROID_STG_RELEASE_NOTES:
        working-directory: ./android
        run: |
          bundle exec fastlane android deploy_stg

      - name: Post deploied comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        if: ${{ github.event.inputs.pull_request_number != '' }}
        env:
          MESSAGE: |
            Deploied Android (Stg) to Firebase App Distribution
        with:
          script: |
            if (Number.isInteger(Number.parseInt("${{ inputs.pull_request_number }}"))) {
              github.rest.issues.createComment({
                issue_number: Number.parseInt("${{ inputs.pull_request_number }}"),
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: process.env.MESSAGE
              })
            }
